name: Feature request
description: Propose a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? What hurts?
      validations:
        required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the outcome be? Include the intended command shape if it affects the CLI surface (e.g. `vkc task bulk …`).
      validations:
        required: true
  - type: textarea
    id: acceptance-sketch
    attributes:
      label: Acceptance sketch
      description: Concrete behavior that would demonstrate the feature works, including at least one failure case the CLI must handle.
      validations:
        required: true
